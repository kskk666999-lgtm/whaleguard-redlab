[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", ".next", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/policy-engine/tests", "labs"]
