name: whaleguard-redlab

x-app-security: &app-security
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whaleguard}
      POSTGRES_USER: ${POSTGRES_USER:-whaleguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/bootstrap_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run python scripts/bootstrap_env.py first}
    command:
      - sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    <<: *app-security
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_UID: ${WHALEGUARD_APP_UID:-1000}
        APP_GID: ${WHALEGUARD_APP_GID:-1000}
    env_file: .env
    environment:
      WHALEGUARD_BIND_HOST: 0.0.0.0
      WHALEGUARD_BIND_PORT: 8000
      WHALEGUARD_DATABASE_URL: ${WHALEGUARD_DATABASE_URL}
      WHALEGUARD_REDIS_URL: ${WHALEGUARD_REDIS_URL}
      WHALEGUARD_JWT_SECRET: ${WHALEGUARD_JWT_SECRET}
      WHALEGUARD_ENCRYPTION_SECRET: ${WHALEGUARD_ENCRYPTION_SECRET}
      WHALEGUARD_CREDENTIALS_FILE: /app/.local/first-run-credentials.txt
      WHALEGUARD_ALLOWED_HOSTS: api,127.0.0.1,localhost
      WHALEGUARD_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      MOCK_AGENT_URL: http://mock-agent:8102
      MOCK_MCP_URL: http://mock-mcp-server:8103
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api_uploads:/app/data/uploads
      - api_reports:/app/data/reports
      - ./.local:/app/.local
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-agent:
        condition: service_healthy
    networks: [edge, backend, arena]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  worker:
    <<: *app-security
    build:
      context: ./apps/worker
    environment:
      REDIS_URL: ${WHALEGUARD_REDIS_URL}
      RQ_QUEUE: whaleguard
      WG_WORKER_ALLOWED_API_ORIGINS: http://api:8000
      WG_WORKER_TOKEN: ${WG_WORKER_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *app-security
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:size=64m,nosuid
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  mock-llm:
    <<: *app-security
    build:
      context: ./labs/mock-llm
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks: [arena]

  mock-mcp-server:
    <<: *app-security
    build:
      context: ./labs/mock-mcp-server
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks: [arena]

  mock-agent:
    <<: *app-security
    build:
      context: ./labs/mock-agent
    environment:
      MOCK_LLM_URL: http://mock-llm:8101
      MOCK_MCP_URL: http://mock-mcp-server:8103
      MOCK_MCP_ALLOWED_HOSTS: mock-mcp-server
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    depends_on:
      mock-llm:
        condition: service_healthy
      mock-mcp-server:
        condition: service_healthy
    networks: [arena]

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  api_reports:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  arena:
    driver: bridge
    internal: true
