[project]
name = "whaleguard-mock-llm"
version = "0.1.1"
description = "Deterministic OpenAI-compatible LLM for WhaleGuard AgentArena"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=9.0.3,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
