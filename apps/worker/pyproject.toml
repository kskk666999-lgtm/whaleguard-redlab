[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "whaleguard-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0,<6",
  "rq>=2.11,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/whaleguard_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
